name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate version and maintainer opt-in
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PUBLISH_BINARIES: ${{ vars.PUBLISH_BINARIES }}
        run: |
          python scripts/check-publication.py --tag "$RELEASE_TAG"
          test "$PUBLISH_BINARIES" = true || { echo 'Maintainer opt-in is required before publishing binaries.' >&2; exit 1; }
  verify:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  publish:
    needs: [validate-tag, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: windows-x64-package
          path: release-assets
      - name: Verify and publish prerelease
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum -c SHA256SUMS.txt
          # --verify-tag and no --clobber: never silently replace a release.
          args=(--verify-tag --generate-notes --title "Pikker $RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}" pikker-windows-x64.zip SHA256SUMS.txt
