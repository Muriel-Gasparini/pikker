name: Bug report
description: Report a reproducible problem without personal data or credentials.
body:
  - type: markdown
    attributes:
      value: Do not attach lockfiles, tokens, profile/cache files or raw player captures.
  - type: input
    id: version
    attributes:
      label: Pikker and operating-system versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps, expected behavior and actual behavior
    validations:
      required: true
