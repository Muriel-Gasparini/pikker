[package]
name = "pikker"
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.94"
description = "Lightweight League of Legends champion-select companion"
repository = "https://github.com/Muriel-Gasparini/pikker"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
httpdate = "=1.0.3"
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
base64 = "=0.23.1"
httparse = "=1.10.1"
slint = { version = "~1.18", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-software"], optional = true }
i-slint-backend-testing = { version = "=1.18.1", default-features = false, optional = true }

[features]
default = ["gui"]
gui = ["dep:slint", "dep:slint-build"]
gui-test = ["gui", "dep:i-slint-backend-testing"]

[build-dependencies]
slint-build = { version = "~1.18", optional = true }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[[bin]]
name = "pikker"
path = "src/main.rs"
required-features = ["gui"]

[profile.release]
lto = "thin"
strip = true
